name: Deploy Website to OVH

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP & Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, dom, filter, json, curl, zip
          coverage: none

      - name: Install PHP API dependencies
        run: |
          cd public/api
          composer install --no-dev --optimize-autoloader

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Sanitize FTP Server Host
        id: clean_ftp
        run: |
          CLEAN_HOST=$(echo "${{ secrets.FTP_SERVER }}" | sed -e 's|^[^:]*://||' -e 's|/*$||')
          echo "Clean FTP Host: $CLEAN_HOST"
          echo "host=$CLEAN_HOST" >> $GITHUB_OUTPUT

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.clean_ftp.outputs.host }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./www/
          dangerous-clean-slate: false
          exclude: |
            **/assets/uploads/**

