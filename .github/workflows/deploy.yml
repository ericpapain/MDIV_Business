name: Deploy Website to OVH

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      # Étape de diagnostic pour tester la connexion FTP vers OVH
      - name: Test FTP Connection
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          CLEAN_SERVER=$(echo "$FTP_SERVER" | sed -e 's|^[^:]*://||' -e 's|/*$||')
          echo "Testing FTP connection to $CLEAN_SERVER with user $FTP_USERNAME..."
          curl -v --connect-timeout 10 "ftp://$CLEAN_SERVER/" --user "$FTP_USERNAME:$FTP_PASSWORD" || echo "FTP Connection Test completed"

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./www/
          dangerous-clean-slate: false
          exclude: |
            **/assets/uploads/**
